[project]
name = "gharchive-lakehouse"
version = "0.1.0"
description = "Open-source lakehouse over the GH Archive dataset (Bronze/Silver/Gold) with Delta Lake, dbt, Dagster and Great Expectations."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "Dixon Alexander" }]

dependencies = [
    "dagster>=1.13.2",
    "dagster-webserver>=1.13.2",
    "dbt-core>=1.11.8",
    "dbt-spark>=1.10.1",
    "delta-spark==3.*",
    "duckdb>=1.5.2",
    "great-expectations>=1.17.0",
    "httpx>=0.27.0",
    "mlflow>=3.11.1",
    "pyspark==3.5.*",
    "python-dotenv>=1.0.1",
    "requests>=2.32.0",
    "pyarrow>=15.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15.12",
    "mypy>=1.19.1",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-spark>=0.6.0",
    "pytest-mock>=3.14.0",
    "pytest-httpx>=0.30.0",
    "types-requests>=2.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "dagster_project"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "dbt/target", "dbt/dbt_packages", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["A", "N"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
ignore_missing_imports = true
exclude = ["dbt/target", "notebooks", ".venv"]

[[tool.mypy.overrides]]
module = ["pyspark.*", "delta.*", "great_expectations.*", "dagster.*"]
ignore_missing_imports = true

# GX 1.x re-exports its expectation classes lazily; mypy can't see the
# `__getattr__` shim, so we silence attr-defined for the suite definitions only.
[[tool.mypy.overrides]]
module = ["src.quality.expectations"]
disable_error_code = ["attr-defined"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "-m",
    "not e2e",
]
testpaths = ["tests"]
markers = [
    "slow: long-running tests",
    "integration: tests requiring external services",
    "spark: tests requiring SparkSession",
    "e2e: full-pipeline end-to-end tests (skipped by default; run with `pytest -m e2e`)",
]

[tool.coverage.run]
source = ["src"]
omit = ["**/__init__.py", "**/conftest.py"]

[tool.coverage.report]
# Target per CLAUDE.md is 80%; scaffold sets 0 until feature code lands.
fail_under = 0
show_missing = true
skip_covered = false
